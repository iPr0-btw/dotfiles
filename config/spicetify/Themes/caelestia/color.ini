highlight-elevated  = 333333    ; Home button and search bar accelerator
selected-row        = FFFFFF                  ; Selections, hover, other coloured text and slider background
button              = FFFFFF                    ; Slider and text buttons
button-active       = FFFFFF                    ; Background buttons
button-disabled     = CCCCCC                    ; Disabled buttons
tab-active          = 262626       ; Profile fallbacks in search
