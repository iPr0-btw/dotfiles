[caelestia]
text                = FFFFFF                  ; Main text colour
subtext             = CCCCCC           ; Subtext colour
main                = 000000                    ; Panel backgrounds
highlight           = 0080FF                    ; Doesn't seem to do anything
misc                = 0080FF                    ; Doesn't seem to do anything
notification        = 555555                    ; Notifications probably
notification-error  = FF0000                      ; Error notifications probably
shadow              = {{ $shadow }}                     ; Shadow for covers, context menu, also affects playlist/artist banners
card                = {{ $surfaceContainer }}           ; Context menu and tooltips
player              = {{ $secondaryContainer }}         ; Background for top result in search
sidebar             = {{ $surfaceContainer }}           ; Background
main-elevated       = {{ $surfaceContainerHigh }}       ; Higher layers than main, e.g. search bar
highlight-elevated  = {{ $surfaceContainerHighest }}    ; Home button and search bar accelerator
selected-row        = FFFFFF                  ; Selections, hover, other coloured text and slider background
button              = 0080FF                    ; Slider and text buttons
button-active       = 0080FF                    ; Background buttons
button-disabled     = 555555                    ; Disabled buttons
tab-active          = {{ $surfaceContainer }}           ; Profile fallbacks in search
