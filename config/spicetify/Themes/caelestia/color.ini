[caelestia]
text                = 000000                  ; Main text colour
subtext             = A9B1D6           ; Subtext colour
main                = {{ $surfaceContainer }}           ; Panel backgrounds
highlight           = 7AA2F7                    ; Doesn't seem to do anything
misc                = 7AA2F7                    ; Doesn't seem to do anything
notification        = 565F89                    ; Notifications probably
notification-error  = F7768E                      ; Error notifications probably
shadow              = {{ $shadow }}                     ; Shadow for covers, context menu, also affects playlist/artist banners
card                = {{ $surfaceContainerHigh }}       ; Context menu and tooltips
player              = {{ $secondaryContainer }}         ; Background for top result in search
sidebar             = 000000                    ; Background
main-elevated       = {{ $surfaceContainerHigh }}       ; Higher layers than main, e.g. search bar
highlight-elevated  = {{ $surfaceContainerHighest }}    ; Home button and search bar accelerator
selected-row        = 000000                  ; Selections, hover, other coloured text and slider background
button              = 7AA2F7                    ; Slider and text buttons
button-active       = 7AA2F7                    ; Background buttons
button-disabled     = 565F89                    ; Disabled buttons
tab-active          = {{ $surfaceContainerHigh }}       ; Profile fallbacks in search
