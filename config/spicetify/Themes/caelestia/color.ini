highlight           = FFFFFF                    ; Doesn't seem to do anything
misc                = FFFFFF                    ; Doesn't seem to do anything
notification        = CCCCCC                    ; Notifications probably
notification-error  = FF5555                      ; Error notifications probably
shadow              = 000000                     ; Shadow for covers, context menu, also affects playlist/artist banners
