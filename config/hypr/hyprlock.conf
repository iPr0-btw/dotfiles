# $text_color = rgba(E3E1EFFF)
# $entry_background_color = rgba(12131C11)
# $entry_border_color = rgba(908F9F55)
# $entry_color = rgba(C6C5D6FF)
$text_color = rgba(FFFFFFFF)
$entry_background_color = rgba(33333311)
$entry_border_color = rgba(3B3B3B55)
$entry_color = rgba(FFFFFFFF)
$font_family = Rubik Light
$font_family_clock = Rubik Light
$font_material_symbols = Material Symbols Rounded

general{
    hide_cursor = true
  }

background {
    # color = rgba(0D0D17FF)
    color = rgba(000000FF)
    # path = {{ SWWW_WALL }}
    # path = screenshot
    # blur_size = 5
    # blur_passes = 4
}
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.1
    dots_spacing = 0.3
    outer_color = $entry_border_color
    inner_color = $entry_background_color
    font_color = $entry_color
    # fade_on_empty = true

    position = 0, -750
    halign = center
    valign = center
}

label { # Clock
    monitor =
    text = cmd[update:1000] date '+%H:%M:%S'
    shadow_passes = 1
    shadow_boost = 0.5
    color = $text_color
    font_size = 195
    font_family = $font_family_clock

    position = 0, 300
    halign = center
    valign = center
}


label { # Date
    monitor =
    text = cmd[update:60000] date '+%Y-%d-%m'
    shadow_passes = 1
    shadow_boost = 0.5
    color = $text_color
    font_size = 48
    font_family = $font_family

    position = 0, 100
    halign = center
    valign = center
}

label { # Status
    monitor =
    text = cmd[update:5000] ~/.config/hypr/status.sh
    shadow_passes = 1
    shadow_boost = 0.5
    color = $text_color
    font_size = 14
    font_family = $font_family

    position = 30, -30
    halign = left
    valign = top
}

label { # Battery
    monitor =
    text = cmd[update:5000] ~/.config/hypr/battery.sh
    shadow_passes = 1
    shadow_boost = 0.5
    color = $text_color
    font_size = 32
    font_family = $font_family

    position = -30, -30
    halign = right
    valign = top
}



