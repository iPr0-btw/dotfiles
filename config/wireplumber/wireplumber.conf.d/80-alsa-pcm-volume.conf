-- Force PipeWire volume control to use PCM instead of Master (Ryzen/ALC285 fix)
monitor.alsa.rules = {
  {
    matches = {
      { { "node.name", "matches", "alsa_output.*" }, },
    },
    apply_properties = {
      ["api.alsa.use-mixer-name"] = "PCM",  -- map volume to PCM
      ["api.alsa.soft-mixer"] = true,       -- use software mixer
      ["api.alsa.disable-mixer"] = true,    -- disable Master hardware mixer
    },
  },
}
