# Enable fading
fading = true;

# Enable shadows
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.7;
shadow-offset-x = -10;
shadow-offset-y = -10;

# Enable transparency (example for terminal)
opacity-rule = [
    "80:class_g = 'your-terminal-class'", # Replace with actual class name
];

# Rounded corners
corner-radius = 10;

# Blur settings
blur-method = "gaussian"; 
blur-strength = 10;       

# Other options
backend = "glx";         
